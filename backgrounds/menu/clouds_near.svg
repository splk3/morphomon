    <rect x="180" y="208" width="220" height="40"/>
    <rect x="232" y="176" width="150" height="44"/>
    <rect x="330" y="196" width="150" height="40"/>
  </g>
  <g fill="#ffe2ab" opacity="0.92">
    <rect x="780" y="226" width="240" height="42"/>
    <rect x="838" y="192" width="160" height="46"/>
    <rect x="958" y="214" width="150" height="40"/>
  </g>
</svg>
