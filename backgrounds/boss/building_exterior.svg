<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" shape-rendering="crispEdges">
  <!-- EXTERIOR of factory/lab BUILDING with an entrance door (boss intro) -->
  <rect width="1280" height="720" fill="none"/>
  <!-- ground -->
  <rect x="0" y="640" width="1280" height="80" fill="#20242e"/>
  <!-- main facade -->
  <rect x="160" y="160" width="960" height="480" fill="#39414f"/>
  <rect x="160" y="160" width="960" height="40" fill="#2c333f"/>
  <!-- roof parapet + vents -->
  <rect x="150" y="140" width="980" height="24" fill="#2a3140"/>
  <g fill="#1c2230">
    <rect x="260" y="108" width="80" height="32"/>
    <rect x="600" y="96" width="90" height="44"/>
    <rect x="900" y="108" width="80" height="32"/>
  </g>
  <!-- smokestack -->
  <rect x="980" y="40" width="40" height="100" fill="#1c2230"/>
  <rect x="974" y="34" width="52" height="10" fill="#2a3140"/>
  <ellipse cx="1000" cy="26" rx="30" ry="14" fill="#3a4252" opacity="0.5"/>
  <!-- window grid -->
  <g fill="#1b3340">
    <rect x="220" y="230" width="70" height="60"/>
    <rect x="330" y="230" width="70" height="60"/>
    <rect x="440" y="230" width="70" height="60"/>
    <rect x="780" y="230" width="70" height="60"/>
    <rect x="890" y="230" width="70" height="60"/>
    <rect x="1000" y="230" width="70" height="60"/>
    <rect x="220" y="330" width="70" height="60"/>
    <rect x="330" y="330" width="70" height="60"/>
    <rect x="440" y="330" width="70" height="60"/>
    <rect x="780" y="330" width="70" height="60"/>
    <rect x="890" y="330" width="70" height="60"/>
    <rect x="1000" y="330" width="70" height="60"/>
  </g>
  <!-- lit windows (sickly glow) -->
  <g fill="#5a6b3a" opacity="0.7">
    <rect x="330" y="230" width="70" height="60"/>
    <rect x="890" y="330" width="70" height="60"/>
    <rect x="220" y="330" width="70" height="60"/>
  </g>
  <!-- window frames -->
  <g stroke="#11151e" stroke-width="3" fill="none">
    <rect x="220" y="230" width="70" height="60"/><rect x="330" y="230" width="70" height="60"/>
    <rect x="440" y="230" width="70" height="60"/><rect x="780" y="230" width="70" height="60"/>
    <rect x="890" y="230" width="70" height="60"/><rect x="1000" y="230" width="70" height="60"/>
    <rect x="220" y="330" width="70" height="60"/><rect x="330" y="330" width="70" height="60"/>
    <rect x="440" y="330" width="70" height="60"/><rect x="780" y="330" width="70" height="60"/>
    <rect x="890" y="330" width="70" height="60"/><rect x="1000" y="330" width="70" height="60"/>
  </g>
  <!-- ENTRANCE: framed doorway the player walks into -->
  <rect x="560" y="440" width="160" height="200" fill="#11151e"/>
  <rect x="548" y="430" width="184" height="14" fill="#2a3140"/>
  <rect x="548" y="430" width="14" height="210" fill="#2a3140"/>
  <rect x="718" y="430" width="14" height="210" fill="#2a3140"/>
  <!-- open-door warm interior glow -->
  <rect x="576" y="456" width="128" height="184" fill="#3a3b2a"/>
  <rect x="600" y="480" width="80" height="160" fill="#6b5a2a" opacity="0.6"/>
  <!-- ENTRANCE sign -->
  <rect x="566" y="404" width="148" height="22" fill="#1c2230"/>
  <rect x="572" y="409" width="136" height="12" fill="#39d0a8" opacity="0.7"/>
  <!-- door warning stripes -->
  <g fill="#ffd15a" opacity="0.7">
    <rect x="548" y="630" width="30" height="10"/>
    <rect x="608" y="630" width="30" height="10"/>
    <rect x="668" y="630" width="30" height="10"/>
  </g>
</svg>
