<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" shape-rendering="crispEdges">
  <!-- distant FACTORY silhouette: smokestacks, pipes, dark industrial (far parallax, transparent base) -->
  <rect width="1280" height="720" fill="none"/>
  <!-- main building blocks -->
  <g fill="#1c2230">
    <rect x="0" y="430" width="280" height="290"/>
    <rect x="300" y="380" width="220" height="340"/>
    <rect x="560" y="460" width="200" height="260"/>
    <rect x="800" y="400" width="240" height="320"/>
    <rect x="1080" y="450" width="200" height="270"/>
  </g>
  <!-- roof details / vents -->
  <g fill="#262d40">
    <rect x="320" y="360" width="60" height="20"/>
    <rect x="440" y="360" width="60" height="20"/>
    <rect x="820" y="380" width="70" height="20"/>
    <rect x="950" y="380" width="70" height="20"/>
  </g>
  <!-- smokestacks -->
  <g fill="#11151e">
    <rect x="120" y="300" width="34" height="130"/>
    <rect x="180" y="330" width="30" height="100"/>
    <rect x="640" y="330" width="34" height="130"/>
    <rect x="1150" y="320" width="32" height="130"/>
  </g>
  <!-- stack caps -->
  <g fill="#2a3146">
    <rect x="116" y="294" width="42" height="10"/>
    <rect x="636" y="324" width="42" height="10"/>
    <rect x="1146" y="314" width="40" height="10"/>
  </g>
  <!-- smoke puffs -->
  <g fill="#3a4252" opacity="0.5">
    <ellipse cx="137" cy="280" rx="34" ry="18"/>
    <ellipse cx="160" cy="258" rx="26" ry="14"/>
    <ellipse cx="657" cy="310" rx="32" ry="16"/>
    <ellipse cx="1166" cy="300" rx="30" ry="15"/>
  </g>
  <!-- overhead pipe run -->
  <rect x="0" y="500" width="1280" height="12" fill="#11151e"/>
  <g fill="#11151e">
    <rect x="240" y="500" width="12" height="160"/>
    <rect x="540" y="500" width="12" height="160"/>
    <rect x="780" y="500" width="12" height="160"/>
    <rect x="1060" y="500" width="12" height="160"/>
  </g>
  <!-- dim lit windows (sickly yellow) -->
  <g fill="#7a7a32" opacity="0.6">
    <rect x="330" y="420" width="14" height="18"/>
    <rect x="360" y="420" width="14" height="18"/>
    <rect x="330" y="460" width="14" height="18"/>
    <rect x="840" y="440" width="14" height="18"/>
    <rect x="870" y="440" width="14" height="18"/>
    <rect x="1110" y="490" width="14" height="18"/>
    <rect x="1140" y="490" width="14" height="18"/>
  </g>
</svg>
