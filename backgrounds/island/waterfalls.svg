<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" shape-rendering="crispEdges">
  <!-- distant white WATERFALLS overlay, cascading down mountain valleys (transparent base) -->
  <rect width="1280" height="720" fill="none"/>
  <!-- waterfall 1 (left valley) -->
  <g>
    <rect x="296" y="360" width="20" height="190" fill="#f4fbff" opacity="0.9"/>
    <rect x="300" y="360" width="12" height="190" fill="#ffffff" opacity="0.95"/>
    <rect x="290" y="382" width="32" height="6" fill="#ffffff" opacity="0.5"/>
    <rect x="288" y="430" width="36" height="6" fill="#ffffff" opacity="0.5"/>
    <rect x="286" y="486" width="40" height="6" fill="#ffffff" opacity="0.5"/>
    <!-- splash pool -->
    <ellipse cx="306" cy="552" rx="40" ry="10" fill="#eaf7ff" opacity="0.8"/>
  </g>
  <!-- waterfall 2 (center valley) -->
  <g>
    <rect x="612" y="330" width="26" height="232" fill="#f4fbff" opacity="0.9"/>
    <rect x="618" y="330" width="14" height="232" fill="#ffffff" opacity="0.95"/>
    <rect x="604" y="356" width="42" height="6" fill="#ffffff" opacity="0.5"/>
    <rect x="602" y="416" width="46" height="6" fill="#ffffff" opacity="0.5"/>
    <rect x="600" y="486" width="50" height="6" fill="#ffffff" opacity="0.5"/>
    <ellipse cx="625" cy="564" rx="52" ry="12" fill="#eaf7ff" opacity="0.8"/>
  </g>
  <!-- waterfall 3 (right valley) -->
  <g>
    <rect x="980" y="360" width="22" height="200" fill="#f4fbff" opacity="0.9"/>
    <rect x="985" y="360" width="12" height="200" fill="#ffffff" opacity="0.95"/>
    <rect x="974" y="388" width="34" height="6" fill="#ffffff" opacity="0.5"/>
    <rect x="972" y="442" width="38" height="6" fill="#ffffff" opacity="0.5"/>
    <rect x="970" y="500" width="42" height="6" fill="#ffffff" opacity="0.5"/>
    <ellipse cx="991" cy="562" rx="42" ry="10" fill="#eaf7ff" opacity="0.8"/>
  </g>
</svg>
