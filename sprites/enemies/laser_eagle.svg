<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" shape-rendering="crispEdges">
  <!-- robotic LASER EAGLE, side profile, beak pointing LEFT toward player -->
  <!-- tail (right) -->
  <polygon points="78,46 94,38 92,52 94,62 78,56" fill="#5b6470" stroke="#15191f" stroke-width="3"/>
  <!-- raised mechanical wing -->
  <polygon points="44,40 70,8 64,40" fill="#7a8593" stroke="#15191f" stroke-width="3"/>
  <polygon points="50,40 60,16 56,40" fill="#9aa6b4" stroke="#15191f" stroke-width="2"/>
  <!-- body chassis -->
  <rect x="40" y="40" width="40" height="26" rx="3" fill="#8a96a4" stroke="#15191f" stroke-width="3"/>
  <!-- panel rivets / plating -->
  <rect x="46" y="46" width="28" height="3" fill="#5b6470"/>
  <rect x="50" y="56" width="22" height="3" fill="#5b6470"/>
  <rect x="44" y="44" width="3" height="3" fill="#c6d0db"/>
  <rect x="74" y="44" width="3" height="3" fill="#c6d0db"/>
  <!-- mechanical legs/talons -->
  <rect x="50" y="66" width="4" height="10" fill="#444c56"/>
  <polygon points="46,76 58,76 54,82 50,82" fill="#2c333b" stroke="#15191f" stroke-width="2"/>
  <rect x="66" y="66" width="4" height="10" fill="#444c56"/>
  <polygon points="62,76 74,76 70,82 66,82" fill="#2c333b" stroke="#15191f" stroke-width="2"/>
  <!-- head -->
  <rect x="22" y="34" width="26" height="22" rx="2" fill="#9aa6b4" stroke="#15191f" stroke-width="3"/>
  <!-- crest fin -->
  <polygon points="40,34 50,22 46,34" fill="#b51224" stroke="#15191f" stroke-width="2"/>
  <!-- glowing red eye -->
  <rect x="28" y="40" width="8" height="6" fill="#ff2a2a" stroke="#15191f" stroke-width="2"/>
  <rect x="30" y="41" width="3" height="3" fill="#ffd0d0"/>
  <!-- mechanical beak/cannon pointing LEFT, emitter tip -->
  <polygon points="22,42 6,46 22,52" fill="#6b7480" stroke="#15191f" stroke-width="3"/>
  <rect x="2" y="44" width="6" height="6" fill="#3a4250" stroke="#15191f" stroke-width="2"/>
  <rect x="1" y="46" width="3" height="2" fill="#5fd0ff"/>
</svg>
