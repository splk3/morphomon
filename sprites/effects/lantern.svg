<svg xmlns="http://www.w3.org/2000/svg" width="48" height="64" viewBox="0 0 48 64" shape-rendering="crispEdges">
  <!-- hanging pirate/galleon lantern: brass frame + warm glass -->
  <!-- hook + chain -->
  <rect x="22" y="0" width="4" height="6" fill="#5a4326"/>
  <rect x="20" y="4" width="8" height="4" fill="#8a6a36"/>
  <!-- top cap / vent -->
  <rect x="14" y="8" width="20" height="6" fill="#9c7838" stroke="#3c2c14" stroke-width="2"/>
  <polygon points="16,8 24,2 32,8" fill="#b08a44" stroke="#3c2c14" stroke-width="2"/>
  <!-- frame body -->
  <rect x="12" y="14" width="24" height="38" fill="#7a5c2c" stroke="#3c2c14" stroke-width="2"/>
  <!-- warm glass panel -->
  <rect x="16" y="18" width="16" height="30" fill="#ffd470"/>
  <rect x="18" y="20" width="12" height="26" fill="#ffe9a8"/>
  <!-- inner flame glow -->
  <rect x="22" y="30" width="4" height="12" fill="#ff9a2a"/>
  <rect x="23" y="28" width="2" height="6" fill="#fff3c2"/>
  <!-- frame bars -->
  <rect x="23" y="14" width="2" height="38" fill="#5a4326"/>
  <rect x="12" y="30" width="24" height="2" fill="#5a4326"/>
  <!-- bottom base -->
  <rect x="14" y="52" width="20" height="6" fill="#9c7838" stroke="#3c2c14" stroke-width="2"/>
  <rect x="20" y="58" width="8" height="4" fill="#5a4326"/>
</svg>
